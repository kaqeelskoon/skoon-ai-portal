<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKOON - Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-container {
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .nav-left h1 {
      color: var(--text-primary);
      margin: 0;
      font-size: 1.8rem;
    }

    .nav-right {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 700;
    }

    .user-name {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-logout {
      padding: 0.6rem 1.2rem;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-logout:hover {
      background: #c73939;
    }

    .lang-toggle {
      padding: 0.6rem 1.2rem;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .lang-toggle:hover {
      background: var(--primary-dark);
    }

    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      text-align: center;
      transition: var(--transition);
    }

    .stat-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(212, 165, 116, 0.1);
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .controls-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      padding: 0.75rem 1rem;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-group label {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .filter-group select {
      padding: 0.6rem 0.9rem;
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      cursor: pointer;
    }

    .filter-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      border-color: var(--primary);
      box-shadow: 0 12px 36px rgba(212, 165, 116, 0.15);
      transform: translateY(-6px);
    }

    .project-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-lighter) 100%);
      overflow: hidden;
      position: relative;
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .project-image::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, transparent 100%);
      pointer-events: none;
    }

    .project-code-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: var(--primary);
      color: #000;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 0.85rem;
    }

    html[lang="ar"] .project-code-badge {
      left: auto;
      right: 1rem;
    }

    .project-content {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .project-name {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .project-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .meta-item {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .meta-item strong {
      color: var(--text-primary);
      display: block;
      font-size: 0.9rem;
    }

    .project-description {
      color: var(--text-secondary);
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 1rem;
      flex: 1;
    }

    .project-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .status-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-construction {
      background: rgba(99, 153, 34, 0.2);
      color: #7acc2d;
    }

    .status-tender {
      background: rgba(186, 117, 23, 0.2);
      color: #ffa500;
    }

    .status-contract {
      background: rgba(212, 165, 116, 0.2);
      color: var(--primary);
    }

    .btn-view {
      padding: 0.5rem 1rem;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-view:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 2rem;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
    }

    .empty-state p {
      margin: 0;
    }

    @media (max-width: 768px) {
      .dashboard-container {
        padding: 1rem;
      }

      .top-nav {
        flex-direction: column;
        align-items: stretch;
      }

      .nav-left h1 {
        font-size: 1.3rem;
      }

      .nav-right {
        width: 100%;
      }

      .user-info {
        flex: 1;
      }

      .stats-section {
        grid-template-columns: repeat(2, 1fr);
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .controls-section {
        flex-direction: column;
      }

      .search-box {
        min-width: 100%;
      }
    }
  </style>
</head>
<body id="dashboard-admin">
  <div class="dashboard-container">
    <!-- Top Navigation -->
    <div class="top-nav">
      <div class="nav-left">
        <h1 data-i18n="dashboard_welcome">Dashboard</h1>
      </div>
      
      <div class="nav-right">
        <button class="lang-toggle" onclick="toggleLanguage()" data-i18n="common_language">العربية</button>
        
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">SK</div>
          <div class="user-name" id="user-name">User Name</div>
        </div>

        <button class="btn-logout" onclick="logout()" data-i18n="common_logout">Logout</button>
      </div>
    </div>

    <!-- Statistics Section -->
    <div class="stats-section">
      <div class="stat-card">
        <div class="stat-number" id="total-count">9</div>
        <div class="stat-label" data-i18n="dashboard_projects">Total Projects</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="construction-count">6</div>
        <div class="stat-label" data-i18n="dashboard_construction">Under Construction</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="tender-count">1</div>
        <div class="stat-label" data-i18n="dashboard_tender">Tender Stage</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="contract-count">1</div>
        <div class="stat-label">Contract Phase</div>
      </div>
    </div>

    <!-- Controls Section -->
    <div class="controls-section">
      <input 
        type="text" 
        id="search-input" 
        class="search-box" 
        placeholder="Search by project code, owner, or name..."
        data-i18n="common_search"
      >
      
      <div class="filter-group">
        <label data-i18n="common_filter">Filter:</label>
        <select id="status-filter">
          <option value="">All Projects</option>
          <option value="construction">Under Construction</option>
          <option value="tender">Tender Stage</option>
          <option value="contract">Contract Phase</option>
        </select>
      </div>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid" id="projects-container">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Initialize
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang');
    if (langParam) currentLanguage = langParam;

    // Check authentication
    if (!authService.isLoggedIn()) {
      window.location.href = 'employee-login.html';
    }

    if (!authService.isEmployee()) {
      window.location.href = 'client-login.html';
    }

    setLanguage(currentLanguage);

    // Update user info
    const user = authService.getUser();
    if (user) {
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
    }

    // Render projects grid
    function renderProjects(projectsToShow = projectsData) {
      const container = document.getElementById('projects-container');

      if (projectsToShow.length === 0) {
        container.innerHTML = '<div class="empty-state"><p data-i18n="project_no_files">No projects found</p></div>';
        return;
      }

      const html = projectsToShow.map(project => `
        <div class="project-card">
          <div class="project-image">
            <span class="project-code-badge">${project.code}</span>
            <img src="project-images/${project.image}" alt="${project.name}"
                 onerror="this.src='https://via.placeholder.com/340x200?text=${project.code}'">
          </div>
          <div class="project-content">
            <div class="project-name">${project.name}</div>
            
            <div class="project-meta">
              <div class="meta-item">
                <strong>${project.owner}</strong>
                <span data-i18n="dashboard_owner">Owner</span>
              </div>
              <div class="meta-item">
                <strong>${project.area}</strong>
                <span data-i18n="common_area">Area</span>
              </div>
              <div class="meta-item">
                <strong>${project.location}</strong>
                <span data-i18n="common_location">Location</span>
              </div>
              <div class="meta-item">
                <strong>${project.type}</strong>
                <span data-i18n="common_scope">Type</span>
              </div>
            </div>

            <div class="project-description">${project.description}</div>

            <div class="project-footer">
              <span class="status-badge status-${project.status}">${project.stage}</span>
              <button class="btn-view" onclick="viewProject(${project.id})" data-i18n="dashboard_view_details">View</button>
            </div>
          </div>
        </div>
      `).join('');

      container.innerHTML = html;
      updateStats(projectsToShow);
    }

    // Update statistics
    function updateStats(projects) {
      const construction = projects.filter(p => p.status === 'construction').length;
      const tender = projects.filter(p => p.status === 'tender').length;
      const contract = projects.filter(p => p.status === 'contract').length;

      document.getElementById('total-count').textContent = projects.length;
      document.getElementById('construction-count').textContent = construction;
      document.getElementById('tender-count').textContent = tender;
      document.getElementById('contract-count').textContent = contract;
    }

    // Filter by status
    document.getElementById('status-filter').addEventListener('change', (e) => {
      const status = e.target.value;
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      
      let filtered = projectsData;
      
      if (status) {
        filtered = filtered.filter(p => p.status === status);
      }
      
      if (searchQuery) {
        filtered = filtered.filter(p =>
          p.code.toLowerCase().includes(searchQuery) ||
          p.owner.toLowerCase().includes(searchQuery) ||
          p.name.toLowerCase().includes(searchQuery)
        );
      }
      
      renderProjects(filtered);
    });

    // Search projects
    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const status = document.getElementById('status-filter').value;

      let filtered = projectsData;

      if (status) {
        filtered = filtered.filter(p => p.status === status);
      }

      if (query) {
        filtered = filtered.filter(p =>
          p.code.toLowerCase().includes(query) ||
          p.owner.toLowerCase().includes(query) ||
          p.name.toLowerCase().includes(query)
        );
      }

      renderProjects(filtered);
    });

    // Initial render
    renderProjects();
  </script>
</body>
</html>
